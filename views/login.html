<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — QueueLess Digital Queue Management</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <a href="/" class="nav-brand">
      <div class="brand-icon">Q</div>
      <div class="brand-name">Queue<span>Less</span></div>
    </a>
    <div class="nav-links" id="navUserContainer">
      <a href="/login" class="btn btn-sm btn-outline">Login</a>
      <a href="/register" class="btn btn-sm btn-primary">
        <span>Register</span>
        <span class="pill-arrow">→</span>
      </a>
    </div>
  </header>

  <!-- Login Form Wrapper -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to manage your queue tokens</p>
      </div>

        <!-- Role Selection Checker -->
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label class="form-label" style="display: flex; justify-content: space-between; align-items: center;">
            <span>Select Account Role</span>
            <span id="roleBadgeIndicator" class="badge badge-waiting" style="font-size: 0.75rem;">Student / User</span>
          </label>
          <div style="display: grid; grid-template-columns: 1fr 1fr; background: var(--bg-sand); padding: 4px; border-radius: var(--radius-md); border: 1.5px solid var(--border); gap: 4px;">
            <label style="margin: 0; cursor: pointer; text-align: center;">
              <input type="radio" name="loginRole" value="user" checked style="display: none;" onchange="updateRoleToggleUI()">
              <div id="roleBtnUser" style="padding: 0.65rem 0.5rem; font-size: 0.88rem; font-weight: 700; border-radius: var(--radius-sm); transition: all 0.2s; background: var(--dark); color: #fff; display: flex; align-items: center; justify-content: center; gap: 0.35rem;">
                <span>🎓</span> Student / User
              </div>
            </label>
            <label style="margin: 0; cursor: pointer; text-align: center;">
              <input type="radio" name="loginRole" value="admin" style="display: none;" onchange="updateRoleToggleUI()">
              <div id="roleBtnAdmin" style="padding: 0.65rem 0.5rem; font-size: 0.88rem; font-weight: 700; border-radius: var(--radius-sm); transition: all 0.2s; background: transparent; color: var(--text-muted); display: flex; align-items: center; justify-content: center; gap: 0.35rem;">
                <span>🛡️</span> Administrator
              </div>
            </label>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="e.g. athul@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" id="submitLoginBtn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          <span>Sign In</span>
          <span class="pill-arrow">→</span>
        </button>
      </form>

      <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account yet? <a href="/register" style="color: var(--primary); font-weight: 700; text-decoration: none;">Create an account</a>
      </p>
    </div>
  </main>

  <script src="/js/auth.js"></script>
  <script>
    function updateRoleToggleUI() {
      const selected = document.querySelector('input[name="loginRole"]:checked').value;
      const userBtn = document.getElementById('roleBtnUser');
      const adminBtn = document.getElementById('roleBtnAdmin');
      const badge = document.getElementById('roleBadgeIndicator');
      const emailInput = document.getElementById('loginEmail');

      if (selected === 'admin') {
        adminBtn.style.background = 'var(--primary)';
        adminBtn.style.color = '#fff';
        userBtn.style.background = 'transparent';
        userBtn.style.color = 'var(--text-muted)';
        if (badge) {
          badge.textContent = 'Administrator';
          badge.className = 'badge badge-called';
        }
        if (emailInput && !emailInput.value) emailInput.placeholder = 'e.g. admin@example.com';
      } else {
        userBtn.style.background = 'var(--dark)';
        userBtn.style.color = '#fff';
        adminBtn.style.background = 'transparent';
        adminBtn.style.color = 'var(--text-muted)';
        if (badge) {
          badge.textContent = 'Student / User';
          badge.className = 'badge badge-waiting';
        }
        if (emailInput && !emailInput.value) emailInput.placeholder = 'e.g. athul@example.com';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect
      if (Auth.isLoggedIn()) {
        const user = Auth.getUser();
        window.location.href = user && user.role === 'admin' ? '/admin-dashboard' : '/user-dashboard';
      }
      Auth.setupNavbar();

      const form = document.getElementById('loginForm');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const role = document.querySelector('input[name="loginRole"]:checked').value;
        await executeLogin(email, password, role);
      });
    });

    async function executeLogin(email, password, role) {
      const btn = document.getElementById('submitLoginBtn');
      btn.disabled = true;
      btn.innerHTML = `<span>Signing in...</span>`;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, role }),
        });

        const data = await res.json();

        if (data.success) {
          Auth.setSession(data.token, data.user);
          Auth.showToast(data.message || 'Logged in successfully!', 'success');
          setTimeout(() => {
            if (data.user.role === 'admin') {
              window.location.href = '/admin-dashboard';
            } else {
              window.location.href = '/user-dashboard';
            }
          }, 600);
        } else {
          Auth.showToast(data.message || 'Login failed', 'error');
          btn.disabled = false;
          btn.innerHTML = `<span>Sign In</span> <span class="pill-arrow">→</span>`;
        }
      } catch (err) {
        Auth.showToast(err.message || 'Network error', 'error');
        btn.disabled = false;
        btn.innerHTML = `<span>Sign In</span> <span class="pill-arrow">→</span>`;
      }
    }
  </script>
</body>
</html>
